apiVersion: v1
kind: Namespace
metadata:
  name: k8s-project-ns
  labels:
    name: k8s-project
    app.kubernetes.io/part-of: k8s-project

---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: k8s-project-ns
  name: k8s-project-config
  labels:
    name: k8s-project
    app.kubernetes.io/part-of: k8s-project

data:
  NODE_ENV: "production"
  APP_NAME: "k8s-project"
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: k8s-project-ns
  name: k8s-project-deployment
  labels:
    name: k8s-project-deployment
    app.kubernetes.io/part-of: k8s-project
spec:
  replicas: 2
  selector:
    matchLabels:
      name: k8s-project-deployment
      app.kubernetes.io/part-of: k8s-project
  template:
    metadata:
      labels:
        name: k8s-project-deployment
        app.kubernetes.io/part-of: k8s-project
    spec:
      containers:
        - name: k8s-project-container
          image: azharfiroz1011/k8s-project:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: k8s-project-config
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  namespace: k8s-project-ns
  name: k8s-project-service
  labels:
    name: k8s-project-service
    app.kubernetes.io/part-of: k8s-project
spec:
  selector:
    name: k8s-project-deployment
    app.kubernetes.io/part-of: k8s-project
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: k8s-project-ns
  name: k8s-project-ingress
  labels:
    name: k8s-project-ingress
    app.kubernetes.io/part-of: k8s-project
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-project-service
                port:
                  number: 80
