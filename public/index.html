<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Manager — Demo Server</title>
  <meta name="description" content="Manage your products with a beautiful, modern dashboard powered by the demo-server REST API." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #13162a;
      --card:      #1a1e35;
      --border:    rgba(255,255,255,0.07);
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --green:     #34d399;
      --red:       #f87171;
      --yellow:    #fbbf24;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    14px;
      --shadow:    0 8px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated background blobs ── */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -200px;
      animation: blob1 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 500px; height: 500px;
      background: #ec4899;
      bottom: -150px; right: -150px;
      animation: blob2 15s ease-in-out infinite alternate;
    }
    @keyframes blob1 { to { transform: translate(80px, 60px) scale(1.1); } }
    @keyframes blob2 { to { transform: translate(-60px, -80px) scale(1.15); } }

    /* ── Layout ── */
    .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }
    .logo h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { color: var(--accent2); }

    .status-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Stats bar ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(108,99,255,0.3); }
    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 340px;
    }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px 10px 42px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108,99,255,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-danger {
      background: rgba(248,113,113,0.12);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
    }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }
    .btn-ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }

    /* ── Product grid ── */
    #products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      animation: cardIn 0.35s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(108,99,255,0.35);
      box-shadow: 0 12px 40px rgba(108,99,255,0.12);
    }

    .product-id {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .product-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .product-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      flex: 1;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .product-price {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--green), #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-actions { display: flex; gap: 8px; }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; margin-bottom: 20px; }

    /* ── Loading ── */
    .loader {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      padding: 60px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      padding: 20px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      transform: scale(0.95) translateY(16px);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      font-size: 18px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); border-color: var(--red); }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.6px; }
    .form-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
    .form-input::placeholder { color: var(--muted); }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      animation: toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      min-width: 260px;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } }
    .toast.success { border-color: rgba(52,211,153,0.3); color: var(--green); }
    .toast.error   { border-color: rgba(248,113,113,0.3); color: var(--red); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 16px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon">📦</div>
        <h1>Product <span>Manager</span></h1>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        API Connected
      </div>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Products</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Price</div>
        <div class="stat-value" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Value</div>
        <div class="stat-value" id="stat-value">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search products…" />
      </div>
      <button class="btn btn-primary" id="add-btn" onclick="openModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Product
      </button>
    </div>

    <!-- Product Grid -->
    <div id="products-grid">
      <div class="loader"><div class="spinner"></div></div>
    </div>

  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Add Product</span>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      </div>
      <form id="product-form" onsubmit="handleSubmit(event)">
        <input type="hidden" id="product-id" />
        <div class="form-group">
          <label class="form-label" for="field-name">Name *</label>
          <input class="form-input" id="field-name" type="text" placeholder="e.g. Widget Pro" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="field-desc">Description</label>
          <input class="form-input" id="field-desc" type="text" placeholder="Short description…" />
        </div>
        <div class="form-group">
          <label class="form-label" for="field-price">Price (USD) *</label>
          <input class="form-input" id="field-price" type="number" step="0.01" min="0" placeholder="e.g. 29.99" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script>
    const API = '/api/v1/products';
    let allProducts = [];

    // ── Fetch & render ──────────────────────────────────────────
    async function loadProducts() {
      try {
        const res = await fetch(API);
        allProducts = await res.json();
        renderProducts(allProducts);
        updateStats(allProducts);
      } catch {
        toast('Failed to load products', 'error');
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');
      if (!products.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
            <p>No products found. Add your first one!</p>
            <button class="btn btn-primary" onclick="openModal()">Add Product</button>
          </div>`;
        return;
      }
      grid.innerHTML = products.map((p, i) => `
        <div class="product-card" style="animation-delay:${i * 0.05}s">
          <div class="product-id">ID #${p.id}</div>
          <div class="product-name">${escHtml(p.name)}</div>
          <div class="product-desc">${escHtml(p.description || 'No description provided.')}</div>
          <div class="product-footer">
            <div class="product-price">$${Number(p.price).toFixed(2)}</div>
            <div class="card-actions">
              <button class="btn btn-ghost btn-sm" onclick="openModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑</button>
            </div>
          </div>
        </div>`).join('');
    }

    function updateStats(products) {
      const total = products.length;
      const avg   = total ? products.reduce((s, p) => s + p.price, 0) / total : 0;
      const val   = products.reduce((s, p) => s + p.price, 0);
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-avg').textContent   = '$' + avg.toFixed(2);
      document.getElementById('stat-value').textContent = '$' + val.toFixed(2);
    }

    // ── Search ──────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p =>
        p.name.toLowerCase().includes(q) ||
        (p.description || '').toLowerCase().includes(q)
      );
      renderProducts(filtered);
    });

    // ── Modal ───────────────────────────────────────────────────
    function openModal(product = null) {
      document.getElementById('modal-title').textContent  = product ? 'Edit Product' : 'Add Product';
      document.getElementById('submit-btn').textContent   = product ? 'Save Changes' : 'Save Product';
      document.getElementById('product-id').value         = product ? product.id : '';
      document.getElementById('field-name').value         = product ? product.name : '';
      document.getElementById('field-desc').value         = product ? (product.description || '') : '';
      document.getElementById('field-price').value        = product ? product.price : '';
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.getElementById('product-form').reset();
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    // ── CRUD ────────────────────────────────────────────────────
    async function handleSubmit(e) {
      e.preventDefault();
      const id    = document.getElementById('product-id').value;
      const body  = {
        name:        document.getElementById('field-name').value.trim(),
        description: document.getElementById('field-desc').value.trim(),
        price:       parseFloat(document.getElementById('field-price').value),
      };
      try {
        const res = await fetch(id ? `${API}/${id}` : API, {
          method:  id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });
        if (!res.ok) throw new Error();
        toast(id ? 'Product updated!' : 'Product added!', 'success');
        closeModal();
        await loadProducts();
      } catch {
        toast('Something went wrong', 'error');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        toast('Product deleted', 'success');
        await loadProducts();
      } catch {
        toast('Failed to delete', 'error');
      }
    }

    // ── Toast ───────────────────────────────────────────────────
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ── Utils ───────────────────────────────────────────────────
    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ────────────────────────────────────────────────────
    loadProducts();
  </script>
</body>
</html>
